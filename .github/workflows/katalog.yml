name: Katalog PDF

# index.html (admin panelden yayın dahil) değişince fiyatsız ürün kataloğunu yeniden üretir.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/katalog/**
  workflow_dispatch:

concurrency:
  group: katalog
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  katalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pillow
        run: pip install --quiet pillow

      - name: PDF üret
        run: python3 .github/katalog/katalog.py "$(command -v google-chrome || command -v chromium)"

      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Daisy-Patisserie-Katalog.pdf
          if git diff --cached --quiet; then echo "Degisiklik yok"; exit 0; fi
          git commit -m "Katalog PDF guncellendi"
          for i in 1 2 3; do git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && break; sleep 5; done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
